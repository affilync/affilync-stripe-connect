[pytest]
; Tests import the service as `app.*` — the SAME tree backend/app/main.py
; itself imports (the old harness imported `backend.app.*`, a parallel
; module tree whose patches/overrides the running app never saw).
pythonpath = backend
asyncio_mode = auto
; Both test trees are packages named `tests` (tests/ and backend/tests/);
; under the default import mode they collide ("No module named
; 'tests.test_billing'"), and CI ran only backend/tests — the 21 tests in
; tests/ never ran there. importlib mode lets one `pytest` collect both.
testpaths = tests backend/tests
addopts = --import-mode=importlib
